services:
  reev-wa-gateway:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/sessions
    volumes:
      - reev_sessions:/app/sessions
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  reev_sessions:
